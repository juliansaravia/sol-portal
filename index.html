<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suite Sol Inmobiliaria</title>
<!-- No hay menú de portales: cada uno vive en su propia dirección.
       app.desarrollosol.com    → admin.html    (portal interno)
       vender.desarrollosol.com → vendedor.html (vendedores)
     En el dominio de Vercel, la raíz es el portal interno. Decisión
     del dueño (1 sept 2026): sin opciones que elegir. -->
<!-- Se conservan #hash y ?query: ahí vienen los tokens del correo de invitación. Un meta-refresh los perdía. -->
<script>/* vender.* abre el portal de vendedores; todo lo demás, el interno. Los rewrites por host de vercel.json no aplican a '/' porque index.html existe como archivo: se decide aquí. */location.replace((/^vender\./i.test(location.hostname)?'vendedor.html':'admin.html') + location.search + location.hash);</script>
<style>body{margin:0;font-family:-apple-system,Arial,sans-serif;background:#14342B;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body><a href="admin.html" style="color:#fff">Entrando al portal interno…</a></body>
</html>
