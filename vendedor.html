<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2E6B4F" />
<link rel="manifest" href="manifest-vendedor.webmanifest" />
<link rel="icon" href="assets/icono.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icono-180.png" />
<link rel="preconnect" href="https://wdykbczkihveccgujqfc.supabase.co" crossorigin />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SOL Ventas" />
<title>Sol Inmobiliaria · Portal de Vendedores</title>
<link rel="stylesheet" href="styles.css" />
<script>/* Un Chrome muy viejo no entiende el código del portal: se le pide actualizar en vez de dejarlo en blanco. */try{new Function('var a={};a?.b??0;');}catch(e){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<div style="font-family:sans-serif;padding:36px 24px;text-align:center;line-height:1.5"><h2 style="color:#2E6B4F">Hay que actualizar el navegador</h2><p>Este teléfono tiene una versión vieja de Chrome. Abrí <b>Play Store</b>, buscá <b>Chrome</b>, tocá <b>Actualizar</b> y volvé a entrar.</p></div>';});}</script>
<script>if('serviceWorker' in navigator&&/^https:/.test(location.protocol))addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
</head>
<body>

<div id="login" class="login-screen"></div>
<div id="portalCliente" class="portal" hidden></div>

<div class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 30l16-14 16 14"/><path d="M12 26v12h24V26"/><path d="M24 6v4M9 11l2.8 2.8M39 11l-2.8 2.8M4 24h4M40 24h4"/></svg></div>
      <div><div class="brand-name">SOL</div><div class="brand-sub" id="brandRole">Inmobiliaria</div></div>
    </div>
    <div class="proyecto-sel">
      <label>Proyecto</label>
      <select id="proyectoActivo" onchange="cambiarProyecto(this.value)">
        <option value="RLE">La Esperanza</option>
      </select>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-sec">Inicio</div>
      <button class="nav-item active" data-view="inicio"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span>Inicio</span></button>
      <button class="nav-item" data-view="asuntos"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/></svg></span><span>Centro de asuntos</span><span class="nav-badge" id="badgeAsuntos" hidden></span></button>
      <div class="nav-sec">Inventario</div>
      <button class="nav-item" data-view="inventario"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span><span>Inventario</span></button>
      <div class="nav-sec">Ventas</div>
      <button class="nav-item" data-view="cotizador"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></span><span>Cotizador</span></button>
      <button class="nav-item" data-view="vender"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span><span>Ingresar venta</span></button>
      <button class="nav-item" data-view="clientes"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-5-6.3"/></svg></span><span>Clientes</span></button>
      <div class="nav-sec">Cartera</div>
      <button class="nav-item" data-view="comisiones"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5L5 19M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM17.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg></span><span>Comisiones</span></button>
    </nav>
    <div class="sidebar-foot">
      <div id="footUser" style="margin-bottom:8px"></div>
      <button class="btn btn-ghost btn-sm" style="width:100%" onclick="logout()">↩ Cerrar sesión</button>
      <button class="btn-reset" onclick="if(confirm('¿Borrar los datos guardados y volver al estado original?'))resetDB()">Reiniciar datos</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn-menu" aria-label="Menú" onclick="document.querySelector('.sidebar').classList.toggle('abierta')">☰</button>
      <div>
        <h1 id="viewTitle">Inicio</h1>
        <div class="sub" id="viewSub">Panel general del suite</div>
      </div>
      <div class="search-wrap">
        <input id="globalSearch" class="search-input" placeholder="Buscar lote, contrato o cliente…"
               oninput="buscarGlobal(this.value)" autocomplete="off">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<nav class="tabbar" id="tabbar"><button class="tab-item" data-view="inicio"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span>Inicio</span></button><button class="tab-item" data-view="cotizador"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></span><span>Cotizar</span></button><button class="tab-item" data-view="vender"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span><span>Vender</span></button><button class="tab-item" data-view="clientes"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-5-6.3"/></svg></span><span>Clientes</span></button><button class="tab-item" data-view="comisiones"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5L5 19M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM17.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg></span><span>Comisiones</span></button></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" hidden></div>
<div class="modal-scrim" id="modalScrim" hidden><div class="modal" id="modal"></div></div>

<!-- El vendedor cotiza, ingresa ventas y ve sus propias comisiones.
     No concilia el banco, no administra permisos y no registra
     desistimientos: esos módulos no viajan a su navegador.
     _pruebas/probar-paginas.mjs dibuja sus seis pantallas para
     comprobar que el recorte no le quitó nada que sí use. -->
<script>window.PORTAL='vendedor';</script>
<script src="assets/lotes-geo.js"></script>
<script src="assets/lotes-shape.js"></script>
<script src="assets/marca.js"></script>
<script src="data.js"></script>
<script src="datos-julio.js"></script>
<script src="permisos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config-supabase.js"></script>
<script src="supabase.js"></script>
<script src="mfa.js"></script>
<script src="datos-remotos.js"></script>
<script src="escribir.js"></script>
<script src="store.js"></script>
<script src="comisiones.js"></script>
<script src="contrato.js"></script>
<script src="cotizacion.js"></script>
<script src="ocr.js"></script>
<script src="expedientes.js"></script>
<script src="app.js"></script>
<script src="version.js"></script>
</body>
</html>
